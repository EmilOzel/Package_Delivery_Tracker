services:
  api:
    build: .
    ports:
      - "7070:7070"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DEPLOYED: "true"
      PORT: "7070"
      CONNECTION_STR: "jdbc:postgresql://database:5432/"
      DB_NAME: "PackageTracker"
      DB_USERNAME: "postgres"
      DB_PASSWORD: "${DB_PASSWORD}"
      OPENROUTESERVICE_API_KEY: "${OPENROUTESERVICE_API_KEY}"
      JWT_SECRET: "${JWT_SECRET}"

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "PackageTracker"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PackageTracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - package-tracker-data:/var/lib/postgresql/data

volumes:
  package-tracker-data:
